# These are supported funding model platforms

github: # Replace with your GitHub handle, e.g., [user1, user2]
patreon: astronomy_software # Replace with your Patreon username
open_collective: astronomy-software # Replace with your Open Collective slug
ko_fi: # Replace with your Ko-fi username
tidelift: # Replace with your Tidelift platform/package, e.g., npm/babel
community_bridge: # Replace with your Community Bridge project-name, e.g., cloud-foundry
liberapay: # Replace with your Liberapay username
issuehunt: # Replace with your IssueHunt username
lfx_crowdfunding: # Replace with your LFX Crowdfunding project-name, e.g., cloud-foundry
custom: # Replace with up to 4 custom sponsorship URLs e.g., ['https://example.com', 'https://example.org']
